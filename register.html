<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>テスト・課題登録</title>

    <style>

        body {
            font-family: 'UD Digi Kyokasho N-R', sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 600px;
            margin: 0 auto 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .saveButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancelButton {
            margin-top: 20px;
            margin-left: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #existing {
            max-width: 800px;
            margin: 0 auto;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            color: white;
        }

        .item.test {
            background-color: tomato;
        }

        .item.task {
            background-color: steelblue;
        }

        .itemData,
        .itemPeriod,
        .itemSubject,
        .itemTitle {
            margin-right: 20px;
        }

        .itemButtons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .editButton,
        .deleteButton {
            padding: 6px 12px;
            cursor: pointer;
        }

        .deleteButton {
            color: #c00000;
        }

    </style>
</head>


<body>

    <h1 id="formTitle">テスト・課題を登録</h1>


    <form id="scheduleForm">


        <label for="type">種類</label>

        <select id="type">

            <option value="test">
                テスト
            </option>

            <option value="task">
                課題
            </option>

        </select>


        <label for="date">日付</label>

        <input
            type="date"
            id="date"
            required
        >


        <label for="period">何時間目</label>

        <select id="period">

            <option value="">
                指定なし
            </option>

            <option value="1">1時間目</option>
            <option value="2">2時間目</option>
            <option value="3">3時間目</option>
            <option value="4">4時間目</option>
            <option value="5">5時間目</option>
            <option value="6">6時間目</option>
            <option value="7">7時間目</option>

        </select>


        <label for="subject">教科</label>

        <input
            type="text"
            id="subject"
            placeholder="例：物理基礎"
            required
        >


        <label for="title">タイトル</label>

        <input
            type="text"
            id="title"
            placeholder="例：単元テスト"
            required
        >


        <label for="detail">詳細</label>

        <textarea
            id="detail"
            placeholder="例：運動とエネルギー"
        ></textarea>


        <button
            type="submit"
            class="saveButton"
            id="saveButton"
        >
            登録
        </button>


        <button
            type="button"
            class="cancelButton"
            id="cancelButton"
            style="display: none;"
        >
            編集をキャンセル
        </button>

    </form>


    <div id="existing">

        <h2>登録済み</h2>

        <div id="existingList">
            読み込み中...
        </div>

    </div>


    <script type="module">

        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            push,
            set,
            get,
            update,
            remove
        } from
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


        // Firebaseの設定
        const firebaseConfig = {

            apiKey: "AIzaSyBnfTgH_3RXtx71zGdemRYYmpUECUDPTH0",

            authDomain:
                "test-schedule-hato.firebaseapp.com",

            databaseURL:
                "https://test-schedule-hato-default-rtdb.firebaseio.com",

            projectId:
                "test-schedule-hato",

            storageBucket:
                "test-schedule-hato.firebasestorage.app",

            messagingSenderId:
                "717229501969",

            appId:
                "1:717229501969:web:a00c5e9ad374da81f5cbb0"

        };


        // Firebaseを初期化
        const app = initializeApp(firebaseConfig);


        // Realtime Database
        const db = getDatabase(app);


        const form =
            document.getElementById("scheduleForm");

        const typeInput =
            document.getElementById("type");

        const dateInput =
            document.getElementById("date");

        const periodInput =
            document.getElementById("period");

        const subjectInput =
            document.getElementById("subject");

        const titleInput =
            document.getElementById("title");

        const detailInput =
            document.getElementById("detail");

        const formTitle =
            document.getElementById("formTitle");

        const saveButton =
            document.getElementById("saveButton");

        const cancelButton =
            document.getElementById("cancelButton");

        const existingList =
            document.getElementById("existingList");


        let editingId = null;


        // --------------------------------
        // 時間を①②③...に変換
        // --------------------------------

        function formatPeriod(period) {

            const circles = [
                "",
                "①",
                "②",
                "③",
                "④",
                "⑤",
                "⑥",
                "⑦"
            ];

            return circles[Number(period)] || "";

        }


        // --------------------------------
        // 登録済みデータを読み込む
        // --------------------------------

        async function loadSchedules() {

            existingList.innerHTML =
                "読み込み中...";


            try {

                const schedulesRef =
                    ref(db, "schedules");


                const snapshot =
                    await get(schedulesRef);


                existingList.innerHTML = "";


                if (!snapshot.exists()) {

                    existingList.innerHTML =
                        "登録されている予定はありません。";

                    return;

                }


                const schedules = [];


                snapshot.forEach((childSnapshot) => {

                    schedules.push({

                        id: childSnapshot.key,

                        ...childSnapshot.val()

                    });

                });


                // 日付 → 時間順
                schedules.sort((a, b) => {

                    const dateCompare =
                        a.date.localeCompare(b.date);

                    if (dateCompare !== 0) {
                        return dateCompare;
                    }

                    return Number(a.period || 99)
                        - Number(b.period || 99);

                });


                schedules.forEach((data) => {


                    const item =
                        document.createElement("div");


                    item.className =
                        "item " +
                        (
                            data.type === "test"
                                ? "test"
                                : "task"
                        );


                    const itemData =
                        document.createElement("span");

                    itemData.className =
                        "itemData";

                    itemData.textContent =
                        data.date;


                    const itemPeriod =
                        document.createElement("span");

                    itemPeriod.className =
                        "itemPeriod";

                    itemPeriod.textContent =
                        formatPeriod(data.period);


                    const itemSubject =
                        document.createElement("span");

                    itemSubject.className =
                        "itemSubject";

                    itemSubject.textContent =
                        data.subject;


                    const itemTitle =
                        document.createElement("span");

                    itemTitle.className =
                        "itemTitle";

                    itemTitle.textContent =
                        data.title;


                    const itemButtons =
                        document.createElement("div");

                    itemButtons.className =
                        "itemButtons";


                    // 編集ボタン
                    const editButton =
                        document.createElement("button");

                    editButton.className =
                        "editButton";

                    editButton.textContent =
                        "編集";


                    editButton.addEventListener(
                        "click",
                        () => {

                            startEditing(data);

                        }
                    );


                    // 削除ボタン
                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "deleteButton";

                    deleteButton.textContent =
                        "削除";


                    deleteButton.addEventListener(
                        "click",
                        async () => {

                            const result = confirm(
                                "「" +
                                data.subject +
                                " " +
                                data.title +
                                "」を削除しますか？"
                            );


                            if (!result) {
                                return;
                            }


                            try {

                                const scheduleRef =
                                    ref(
                                        db,
                                        "schedules/" +
                                        data.id
                                    );


                                await remove(scheduleRef);


                                if (
                                    editingId === data.id
                                ) {

                                    resetForm();

                                }


                                await loadSchedules();


                            } catch (error) {

                                console.error(error);

                                alert(
                                    "削除に失敗しました。\n" +
                                    error.message
                                );

                            }

                        }
                    );


                    itemButtons.appendChild(
                        editButton
                    );

                    itemButtons.appendChild(
                        deleteButton
                    );


                    item.appendChild(itemData);

                    item.appendChild(itemPeriod);

                    item.appendChild(itemSubject);

                    item.appendChild(itemTitle);

                    item.appendChild(itemButtons);


                    existingList.appendChild(item);

                });


            } catch (error) {

                console.error(error);

                existingList.innerHTML =
                    "データの読み込みに失敗しました。\n" +
                    error.message;

            }

        }


        // --------------------------------
        // 編集開始
        // --------------------------------

        function startEditing(data) {

            editingId = data.id;


            typeInput.value =
                data.type || "test";

            dateInput.value =
                data.date || "";

            periodInput.value =
                data.period || "";

            subjectInput.value =
                data.subject || "";

            titleInput.value =
                data.title || "";

            detailInput.value =
                data.detail || "";


            formTitle.textContent =
                "テスト・課題を編集";


            saveButton.textContent =
                "更新";


            cancelButton.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // --------------------------------
        // フォームをリセット
        // --------------------------------

        function resetForm() {

            editingId = null;

            form.reset();


            formTitle.textContent =
                "テスト・課題を登録";


            saveButton.textContent =
                "登録";


            cancelButton.style.display =
                "none";

        }


        // 編集キャンセル
        cancelButton.addEventListener(
            "click",
            () => {

                resetForm();

            }
        );


        // --------------------------------
        // 登録・更新
        // --------------------------------

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const data = {

                    type:
                        typeInput.value,

                    date:
                        dateInput.value,

                    period:
                        periodInput.value,

                    subject:
                        subjectInput.value,

                    title:
                        titleInput.value,

                    detail:
                        detailInput.value

                };


                try {


                    // 新規登録
                    if (editingId === null) {

                        const schedulesRef =
                            ref(db, "schedules");


                        const newScheduleRef =
                            push(schedulesRef);


                        await set(
                            newScheduleRef,
                            data
                        );


                        alert("登録しました。");

                    }


                    // 更新
                    else {

                        const scheduleRef =
                            ref(
                                db,
                                "schedules/" +
                                editingId
                            );


                        await update(
                            scheduleRef,
                            data
                        );


                        alert("更新しました。");

                    }


                    resetForm();

                    await loadSchedules();


                } catch (error) {

                    console.error(error);

                    alert(
                        "保存に失敗しました。\n\n" +
                        error.message
                    );

                }

            }
        );


        // 最初に読み込む
        loadSchedules();

    </script>

</body>
</html>
