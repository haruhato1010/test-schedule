<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>テスト・課題予定</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: 'UD Digi Kyokasho N-R', sans-serif;
            margin: 0;
            padding: 0;
        }


        h1 {
            text-align: center;
            font-size: clamp(24px, 5vw, 40px);
            margin: 0.8em 0;
        }

        #lists {
            width: 100%;
            margin: 0;
            padding: 0 clamp(15px, 3vw, 30px);
        }


        /* --------------------------------
           テスト・課題カード
        -------------------------------- */

        .test,
        .task {
            color: white;
            text-align: center;

            font-size: clamp(16px, 2.5vw, 24px);

            border-radius: 10px;

            padding: 1.5vw;

            margin: 1.5vw 0;
        }


        .test {
            background-color: tomato;
        }


        .task {
            background-color: steelblue;
        }


        /* --------------------------------
           上段
        -------------------------------- */

        .top {
            display: flex;
            align-items: center;

            width: 100%;
        }


        /* --------------------------------
           日付・時間
        -------------------------------- */

        .data {
            text-align: left;

            margin: 0 0.5vw;

            white-space: nowrap;
        }


        .data.period {
            margin-left: 0;
        }


        /* --------------------------------
           教科・タイトル
        -------------------------------- */

        .subject,
        .title {
            text-align: left;

            margin: 0 2vw;

            overflow-wrap: anywhere;
        }


        /* --------------------------------
           開閉ボタン
        -------------------------------- */

        .button {
            margin-left: auto;
            margin-right: 1vw;

            cursor: pointer;
            user-select: none;

            flex-shrink: 0;
        }


        /* --------------------------------
           詳細
        -------------------------------- */

        .detail {
            display: none;

            text-align: left;

            margin: 1.5vw 2vw 0.5vw;

            padding-top: 1vw;

            border-top:
                1px solid rgba(255, 255, 255, 0.5);

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


    </style>
</head>


<body>

    <h1>テスト・課題予定</h1>


    <div id="lists">
        読み込み中...
    </div>


    <script type="module">

        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            get
        } from
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


        // --------------------------------
        // Firebaseの設定
        // --------------------------------

        const firebaseConfig = {

            apiKey:
                "AIzaSyBnfTgH_3RXtx71zGdemRYYmpUECUDPTH0",

            authDomain:
                "test-schedule-hato.firebaseapp.com",

            databaseURL:
                "https://test-schedule-hato-default-rtdb.firebaseio.com",

            projectId:
                "test-schedule-hato",

            storageBucket:
                "test-schedule-hato.firebasestorage.app",

            messagingSenderId:
                "717229501969",

            appId:
                "1:717229501969:web:a00c5e9ad374da81f5cbb0"

        };


        // --------------------------------
        // Firebaseを初期化
        // --------------------------------

        const app =
            initializeApp(firebaseConfig);


        // --------------------------------
        // Realtime Database
        // --------------------------------

        const db =
            getDatabase(app);


        // --------------------------------
        // 日付を MM/DD(曜日) に変換
        // --------------------------------

        function formatDate(dateString) {

            const date =
                new Date(dateString + "T00:00:00");


            const weekdays = [
                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"
            ];


            const month =
                String(date.getMonth() + 1)
                    .padStart(2, "0");


            const day =
                String(date.getDate())
                    .padStart(2, "0");


            const weekday =
                weekdays[date.getDay()];


            return `${month}/${day}(${weekday})`;

        }


        // --------------------------------
        // 時間を①②③...に変換
        // --------------------------------

        function formatPeriod(period) {

            const circles = [
                "",
                "①",
                "②",
                "③",
                "④",
                "⑤",
                "⑥",
                "⑦"
            ];


            return circles[Number(period)] || "";

        }


        // --------------------------------
        // Firebaseから予定を読み込む
        // --------------------------------

        async function loadSchedules() {

            const lists =
                document.getElementById("lists");


            try {

                const schedulesRef =
                    ref(db, "schedules");


                const snapshot =
                    await get(schedulesRef);


                lists.innerHTML = "";


                if (!snapshot.exists()) {

                    lists.innerHTML =
                        "登録されている予定はありません。";

                    return;

                }


                const schedules = [];


                snapshot.forEach((childSnapshot) => {

                    schedules.push({

                        id: childSnapshot.key,

                        ...childSnapshot.val()

                    });

                });


                // --------------------------------
                // 日付 → 時間順に並べる
                // --------------------------------

                schedules.sort((a, b) => {

                    const dateCompare =
                        a.date.localeCompare(b.date);


                    if (dateCompare !== 0) {
                        return dateCompare;
                    }


                    return Number(a.period || 99)
                        - Number(b.period || 99);

                });


                // --------------------------------
                // 予定を表示
                // --------------------------------

                schedules.forEach((data) => {

                    const item =
                        document.createElement("div");


                    item.className =
                        data.type === "test"
                            ? "test"
                            : "task";


                    // --------------------------------
                    // 上段
                    // --------------------------------

                    const top =
                        document.createElement("div");


                    top.className =
                        "top";


                    // --------------------------------
                    // 日付
                    // --------------------------------

                    const date =
                        document.createElement("p");


                    date.className =
                        "data";


                    date.textContent =
                        formatDate(data.date);


                    // --------------------------------
                    // 時間
                    // --------------------------------

                    const period =
                        document.createElement("p");


                    period.className =
                        "data period";


                    period.textContent =
                        formatPeriod(data.period);


                    // --------------------------------
                    // 教科
                    // --------------------------------

                    const subject =
                        document.createElement("p");


                    subject.className =
                        "subject";


                    subject.textContent =
                        data.subject;


                    // --------------------------------
                    // タイトル
                    // --------------------------------

                    const title =
                        document.createElement("p");


                    title.className =
                        "title";


                    title.textContent =
                        data.title;


                    // --------------------------------
                    // 開閉ボタン
                    // --------------------------------

                    const button =
                        document.createElement("span");


                    button.className =
                        "button";


                    button.textContent =
                        "▼";


                    // --------------------------------
                    // 詳細
                    // --------------------------------

                    const detail =
                        document.createElement("div");


                    detail.className =
                        "detail";


                    detail.textContent =
                        data.detail || "";


                    // --------------------------------
                    // 詳細の開閉
                    // --------------------------------

                    button.addEventListener(
                        "click",
                        () => {

                            if (
                                detail.style.display === "none" ||
                                detail.style.display === ""
                            ) {

                                detail.style.display =
                                    "block";


                                button.textContent =
                                    "▲";

                            } else {

                                detail.style.display =
                                    "none";


                                button.textContent =
                                    "▼";

                            }

                        }
                    );


                    // --------------------------------
                    // 要素を追加
                    // --------------------------------

                    top.appendChild(date);

                    top.appendChild(period);

                    top.appendChild(subject);

                    top.appendChild(title);

                    top.appendChild(button);


                    item.appendChild(top);

                    item.appendChild(detail);


                    lists.appendChild(item);

                });


            } catch (error) {

                console.error(error);


                lists.innerHTML =
                    "データの読み込みに失敗しました。";

            }

        }


        // --------------------------------
        // 読み込み開始
        // --------------------------------

        loadSchedules();

    </script>

</body>
</html>
